{% extends "base.html" %}

{% block title %}Sign In - FinTrack Finance & Attendance{% endblock %}

{% block content %}
<div class="auth-page-wrapper">
    <div class="auth-card">
        <div class="auth-header">
            <div class="auth-icon-circle">
                <i class="fa-solid fa-user-lock"></i>
            </div>
            <h2>Welcome Back</h2>
            <p>Log in to access your personal finance dashboard & attendance logs</p>
        </div>

        <form action="{{ url_for('login') }}" method="POST" class="auth-form">
            <div class="form-group">
                <label for="username_or_email">Username or Email</label>
                <div class="input-with-icon">
                    <i class="fa-solid fa-at input-icon"></i>
                    <input 
                        type="text" 
                        id="username_or_email" 
                        name="username_or_email" 
                        placeholder="e.g. alex or alex@example.com" 
                        required 
                        autofocus
                    >
                </div>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div class="input-with-icon">
                    <i class="fa-solid fa-lock input-icon"></i>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        placeholder="••••••••" 
                        required
                    >
                    <button type="button" class="btn-toggle-pwd" onclick="togglePasswordVisibility('password', this)">
                        <i class="fa-solid fa-eye"></i>
                    </button>
                </div>
            </div>

            <button type="submit" class="btn btn-primary btn-block btn-lg">
                <span>Sign In</span>
                <i class="fa-solid fa-arrow-right"></i>
            </button>
        </form>

        <div class="auth-footer">
            <p>Don't have an account yet? <a href="{{ url_for('register') }}">Create an account</a></p>
        </div>
    </div>
</div>
{% endblock %}
